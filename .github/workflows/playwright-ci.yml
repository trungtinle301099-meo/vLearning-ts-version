name: Playwright CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  schedule:
    - cron: '0 16 * * *'
      timezone: 'Asia/Ho_Chi_Minh'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  playwright-test:
    name: Playwright Test
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://demo2.cybersoft.edu.vn' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://demo2.cybersoft.edu.vn' }}
      TOKEN_CYBERSOFT: ${{ secrets.TOKEN_CYBERSOFT }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DEFAULT_GROUP: GP01
      DEFAULT_COURSE_ID: '000'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run quality check
        run: npm run check

      - name: Run Playwright tests
        run: npm run test

      # ==========================================
      # ALLURE
      # ==========================================

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      # ==========================================
      # GITHUB PAGES
      # ==========================================

      - name: Configure GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: reports/playwright/allure-report

      - name: Deploy Allure report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4

      # ==========================================
      # SLACK REPORT
      # ==========================================

      - name: Generate Slack test report
        if: always()
        run: node scripts/generate-slack-report.js
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

          # Allure URL
          ALLURE_REPORT_URL: ${{ steps.deployment.outputs.page_url }}

      # ==========================================
      # ARTIFACTS
      # ==========================================

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/playwright/html
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/playwright/allure-report
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/playwright/junit
          retention-days: 14
          if-no-files-found: warn

      # ==========================================
      # SEND SLACK
      # ==========================================

      - name: Send Slack test report
        if: always()
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ./slack-payload.json