name: Playwright CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  playwright-test:
    name: Playwright Test
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ secrets.BASE_URL || 'https://demo2.cybersoft.edu.vn' }}
      API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://demo2.cybersoft.edu.vn' }}
      TOKEN_CYBERSOFT: ${{ secrets.TOKEN_CYBERSOFT }}
      USERNAME: ${{ secrets.USERNAME }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DEFAULT_GROUP: GP01
      DEFAULT_COURSE_ID: '000'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run quality check
        run: npm run check

      - name: Run Playwright tests
        run: npm run test

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: reports/playwright/html
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: reports/playwright/allure-report
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/playwright/junit
          retention-days: 14
